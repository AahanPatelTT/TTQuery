services:
  tt-query:
    build:
      context: ./
      dockerfile: ./Dockerfile
    #restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - ./env
    environment:
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL}
    volumes:
      - ./artifacts:/app/artifacts